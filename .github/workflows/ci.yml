name: CI

# 参照 cli-analyzer 流水线设计：在多平台上执行自动化回归门禁与构建验证
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression Gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # runner 自带的 npm 10.9 在本仓库的依赖树上会崩：
      #   npm error Cannot read properties of null (reading 'edgesOut')
      # 触发面比想象的宽——先后踩到三次（子目录装、--no-save 加装、甚至把 vitest
      # 写进根 devDependencies 后**连纯 npm install 都崩**，三个平台一起红）。
      # npm 11 没有这个 bug（本地 11.17 跑同样的树全绿），换工具链比绕路干净。
      - name: Use npm 11 (runner-bundled npm 10 crashes on this dependency tree)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm install

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      # 套件自带已知红（tests/__baseline__/known-fails.txt），退出码必然是 1。
      # 放行这一步，交给下一步门禁裁决：失败集合里有没有不在基线内的新面孔。
      # 之前这里只读已提交的 __baseline__/current.json —— 那份快照不会随代码变化，
      # 于是「门禁」对任何改动都恒绿，等于没有测试保护。
      - name: Run test suite
        working-directory: tests
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=../test-results.json

      - name: Regression gate (no pass → fail outside known-fails)
        run: node tests/__baseline__/verify-no-regression.mjs test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results.json
          if-no-files-found: warn

  build-smoke:
    name: Build Gateway Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --include=dev

      - name: Verify build-server compilation
        working-directory: desktop
        run: npm run build-server

      # Phase 0 门禁（ADR-0007）：Bun 必须能跑通完整网关，三平台同一套断言。
      # 本步骤验证的是「能力」——能否用 Bun 替代 Electron 里兼任网关运行时的 Node。
      # 随包分发的那份 Bun 产物（哈希锁定在 desktop/scripts/bun-pin.json）在打包
      # 流水线用 desktop/scripts/verify-bun-pin.mjs 校验，两者职责不同。
      # NODE_OPTIONS：Node 22 的 node:sqlite 需要该标志；Node 24+ 上被忽略，无害。
      - name: Set up Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Assert Bun version matches pin
        shell: bash
        run: |
          PIN=$(node -p "require('./tools/bun-pin.json').version")
          GOT=$(bun --version)
          echo "pin=$PIN got=$GOT"
          [ "$PIN" = "$GOT" ] || { echo "::error::Bun 版本与 pin 不符"; exit 1; }

      - name: Bun gateway gate — Phase 0
        shell: bash
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: node tools/bun-gateway-spike.mjs --port 31888
