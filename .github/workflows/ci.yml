name: CI

# 参照 cli-analyzer 流水线设计：在多平台上执行自动化回归门禁与构建验证
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Regression Gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # vitest 声明在**根** devDependencies 里，因此这一条普通的 npm install 就把
      # 网关依赖与测试运行器一起装好了。
      #
      # 为什么不按本地习惯 `cd tests && npm install`、也不在命令行追加装（--no-save
      # 或 npm install <pkg>）：runner 的 npm 10 在这几条路径上都会崩
      # "Cannot read properties of null (reading 'edgesOut')"（实测三次，纯 npm install
      # 两次都正常）。vitest 也必须落在仓库根——tests/vitest.config.js 那句
      # `import { defineConfig } from "vitest/config"` 是按配置文件位置向上查找的。
      # tests/package.json 原样保留，本地两条路都能用（本地 npm 11 无此问题）。
      - name: Install dependencies (gateway + test runner)
        run: npm install

      # 套件自带已知红（tests/__baseline__/known-fails.txt），退出码必然是 1。
      # 放行这一步，交给下一步门禁裁决：失败集合里有没有不在基线内的新面孔。
      # 之前这里只读已提交的 __baseline__/current.json —— 那份快照不会随代码变化，
      # 于是「门禁」对任何改动都恒绿，等于没有测试保护。
      - name: Run test suite
        working-directory: tests
        continue-on-error: true
        run: npx --no-install vitest run --reporter=json --outputFile=../test-results.json

      - name: Regression gate (no pass → fail outside known-fails)
        run: node tests/__baseline__/verify-no-regression.mjs test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results.json
          if-no-files-found: warn

  build-smoke:
    name: Build Gateway Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --include=dev

      - name: Verify build-server compilation
        working-directory: desktop
        run: npm run build-server
