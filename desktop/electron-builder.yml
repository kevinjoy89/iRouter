# iRouter 打包配置（自用分发：不签名、不公证、不自动更新）
appId: com.irouter.desktop
productName: iRouter
copyright: "跨平台本地 AI 路由网关 · MIT License"

directories:
  # buildResources 与 output 分离：resources/ 是纳入版本控制的源资产，
  # build/ 是生成产物（gitignore）。两者都用默认名 build 会被 electron-builder
  # 当资源目录二次打包，故显式分开。
  buildResources: resources
  output: build/dist

# 壳层自身代码；网关产物走 extraResources 放到 resources/server，
# 绕开 asar（子进程按真实路径读文件，asar 的 fs 兼容面不可赌）
files:
  - main.js
  - preload.js
  - settings.js
  - package.json

extraResources:
  # 网关产物必须嵌套一层（gateway/server）：electron-builder 对复制源下相对路径
  # 恰好为 node_modules 的目录有硬编码排除（app-builder-lib/util/filter.js），
  # 写成 from: build/server 会让 node_modules 整目录静默丢失，产物跑不起来。
  - from: build/gateway
    to: gateway
    filter:
      - "**/*"
  - from: resources/icon.png
    to: icon.png

asar: true
npmRebuild: false
publish: null

# 下载镜像：本地开发机由 scripts/package.mjs 注入 npmmirror 国内镜像；
# CI/Release 海外环境由流水线注入 GitHub Releases 官方源（避免跨国连接抖动）

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: resources/icon.png
  # 启用标准 Ad-Hoc 深度自签名 (codesign -s -)，避免无付费证书开源应用被 macOS 误判为“文件已损坏”
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources/icon.png
  artifactName: "${productName}-${version}-windows-amd64-portable.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-windows-amd64-installer.${ext}"

linux:
  maintainer: "kevinjoy89 <kevinjoy89@126.com>"
  target:
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  icon: resources/icon.png
  artifactName: "${productName}-${version}-linux-amd64.${ext}"

